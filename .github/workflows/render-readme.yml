name: Render README

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: {}

jobs:
  render:
    name: Render README from CSV
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Run renderer
        run: python readme_render.py

      - name: Commit generated README
        uses: EndBug/add-and-commit@v9
        with:
          author_name: 'github-actions[bot]'
          author_email: '41898282+github-actions[bot]@users.noreply.github.com'
          message: 'chore: auto-render README from food-original.csv'
          add: 'README.md'
          push: true
